[project]
name = "Fast Car API"
version = "0.1.0"
description = "API moderna com FastAPI"
authors = [
    { name = "PycodBR", email = "pycodebr@gmail.com" }
]

[tool.ruff]
line-length = 79
extend-exclude = ["migrations"]

[tool.ruff.lint]
preview = true
select = ["I", "F", "E", "W", "PL", "PT"]

[tool.ruff.format]
preview = true

[tool.taskipy.tasks]
lint = "ruff check"
lint_fix = "ruff check --fix"
format = "ruff format"
run = "python -m uvicorn app:app --reload"